name: reset

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ERASE to keep only the latest commit and workflow run"
        required: true
        default: "NO"

jobs:
  squash:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Confirm destructive action
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          [ "$CONFIRM" = "ERASE" ] || { echo "Confirmation failed"; exit 1; }

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Squash history to one commit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          git config user.name "senvora"
          git config user.email "192395417+senvora@users.noreply.github.com"
          git checkout --orphan _temp
          git add -A
          git commit -m "Initial commit"
          git branch -M "$BRANCH"
          git push --force origin "$BRANCH"

  keep-latest-workflow-run:
    runs-on: ubuntu-latest
    needs: squash
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete all other workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT: ${{ github.run_id }}
        run: |
          for attempt in 1 2 3 4 5; do
            IDS=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs?per_page=100" \
              | jq -r --arg cur "$CURRENT" '.workflow_runs[] | select((.id|tostring) != $cur) | .id')
            [ -z "$IDS" ] && { echo "Done."; exit 0; }
            for ID in $IDS; do
              echo "Deleting run $ID"
              curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/runs/$ID" >/dev/null || true
              sleep 1
            done
          done
          echo "Some runs could not be deleted (likely still in progress)."
